<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DBM POS</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:#f5f7fb;color:#172033}button{cursor:pointer;border:0;border-radius:7px;padding:10px 14px;background:#0d6efd;color:#fff}input,select{padding:10px;border:1px solid #d8deea;border-radius:7px;width:100%;margin:4px 0 10px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #edf0f5;text-align:left}.app{display:flex;min-height:100vh}.side{width:230px;background:#101828;color:#fff;padding:20px}.side h2{margin:0 0 25px}.side button{display:block;width:100%;text-align:left;background:transparent;margin:4px 0}.side button:hover{background:#1d2939}.main{flex:1;padding:25px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card,.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 10px #0000000a}.card b{font-size:25px;display:block;margin-top:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none}.login{max-width:400px;margin:12vh auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001}.msg{padding:10px;background:#fff4e5;margin:10px 0;border-radius:7px}.pos{display:grid;grid-template-columns:2fr 1fr;gap:18px}.cart-row{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #eee}@media(max-width:900px){.side{width:180px}.cards{grid-template-columns:1fr 1fr}.pos,.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><h1>DBM POS</h1><p>DBM SOFT POS Management System</p><input id="user" placeholder="Username" value="admin"><input id="pass" type="password" placeholder="Password" value="ChangeMe@12345"><button onclick="login()" style="width:100%">Sign In</button><div id="loginMsg"></div></div>
<div id="app" class="app hidden"><aside class="side"><h2>DBM POS</h2><button onclick="show('dashboard')">Dashboard</button><button onclick="show('products')">Products</button><button onclick="show('pos')">POS Sale</button><button onclick="show('stock')">Stock</button><button onclick="show('masters')">Masters</button><button onclick="logout()">Logout</button></aside><main class="main">
<section id="dashboard"><div class="top"><h1>Dashboard</h1><span id="who"></span><span id="syncStatus" style="padding:8px 12px;border-radius:20px;background:#eef2ff">Sync: checking...</span></div><div id="cards" class="cards"></div></section>
<section id="products" class="hidden"><div class="top"><h1>Products</h1><button onclick="loadProducts()">Refresh</button></div><div class="panel"><div class="grid"><div><input id="pc" placeholder="Product Code"></div><div><input id="pn" placeholder="Product Name"></div><div><input id="pb" placeholder="Barcode"></div><div><input id="cost" type="number" placeholder="Cost Price"></div><div><input id="price" type="number" placeholder="Sale Price"></div><div><input id="mrp" type="number" placeholder="MRP"></div></div><button onclick="createProduct()">Add Product</button><div id="productMsg"></div></div><br><div class="panel"><input id="psearch" placeholder="Search product..." oninput="loadProducts()"><div id="productTable"></div></div></section>
<section id="pos" class="hidden"><h1>POS Sale</h1><div class="pos"><div class="panel"><input id="saleSearch" placeholder="Search product/barcode..." oninput="renderSaleProducts()"><div id="saleProducts"></div></div><div class="panel"><h3>Cart</h3><div id="cart"></div><hr><b>Total: <span id="total">0.00</span></b><input id="paid" type="number" placeholder="Paid amount"><button onclick="completeSale()" style="width:100%">Complete Sale</button><div id="saleMsg"></div></div></div></section>
<section id="stock" class="hidden"><div class="top"><h1>Stock</h1><button onclick="loadStock()">Refresh</button></div><div class="panel"><select id="warehouse"></select><div id="stockTable"></div></div></section>
<section id="masters" class="hidden"><h1>Master Data</h1><div class="grid"><div class="panel"><h3>Category</h3><input id="cc" placeholder="Code"><input id="cn" placeholder="Name"><button onclick="addCategory()">Add</button></div><div class="panel"><h3>Brand</h3><input id="bc" placeholder="Code"><input id="bn" placeholder="Name"><button onclick="addBrand()">Add</button></div><div class="panel"><h3>Unit</h3><input id="uc" placeholder="Code"><input id="un" placeholder="Name"><button onclick="addUnit()">Add</button></div><div class="panel"><h3>Customer</h3><input id="custc" placeholder="Code"><input id="custn" placeholder="Name"><input id="custp" placeholder="Phone"><button onclick="addCustomer()">Add</button></div></div></section>
</main></div>
<script>
let token=localStorage.getItem('dbm_token'),products=[],cart=[],warehouses=[];
const $=id=>document.getElementById(id);
async function api(url,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch(url,opt);if(r.status===401){logout();throw Error('Unauthorized')}let d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'Request failed');return d}
async function login(){try{let d=await api('/api/Auth/login',{method:'POST',body:JSON.stringify({username:$('user').value,password:$('pass').value})});token=d.token;localStorage.setItem('dbm_token',token);start()}catch(e){$('loginMsg').innerHTML='<div class="msg">'+e.message+'</div>'}}
function logout(){localStorage.removeItem('dbm_token');location.reload()}
async function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');let m=await api('/api/Auth/me');$('who').textContent=m.fullName;await loadWarehouses();await loadDashboard()}
function show(id){['dashboard','products','pos','stock','masters'].forEach(x=>$(x).classList.toggle('hidden',x!==id));if(id==='dashboard')loadDashboard();if(id==='products')loadProducts();if(id==='pos'){loadProducts();renderSaleProducts()}if(id==='stock')loadStock()}
async function loadSyncStatus(){try{let d=await api('/api/sync-status');$('syncStatus').textContent='Sync: '+d.pending+' pending / '+d.failed+' failed';}catch(e){$('syncStatus').textContent='Local API: OK'}}
async function loadDashboard(){await loadSyncStatus();let d=await api('/api/dashboard/summary');$('cards').innerHTML=[['Today Sales',d.salesAmount],['Paid',d.paidAmount],['Due',d.dueAmount],['Products',d.products],['Purchases',d.purchaseAmount],['Customers',d.customers],['Suppliers',d.suppliers],['Stock Units',d.totalStockUnits]].map(x=>'<div class="card">'+x[0]+'<b>'+Number(x[1]).toLocaleString()+'</b></div>').join('')}
async function loadProducts(){products=await api('/api/products?search='+encodeURIComponent($('psearch')?.value||''));$('productTable').innerHTML='<table><tr><th>Code</th><th>Name</th><th>Barcode</th><th>Sale</th><th>Stock</th></tr>'+products.map(p=>'<tr><td>'+p.productCode+'</td><td>'+p.productName+'</td><td>'+p.barcode+'</td><td>'+p.salePrice+'</td><td><button onclick="addCart(\''+p.id+'\')">Add</button></td></tr>').join('')+'</table>';renderSaleProducts()}
function renderSaleProducts(){let s=($('saleSearch')?.value||'').toLowerCase();let a=products.filter(p=>(p.productName+p.productCode+(p.barcode||'')).toLowerCase().includes(s));$('saleProducts').innerHTML=a.map(p=>'<div class="cart-row"><span>'+p.productName+'<br><small>'+p.salePrice+'</small></span><button onclick="addCart(\''+p.id+'\')">+</button></div>').join('')}
function addCart(id){let p=products.find(x=>x.id===id);let x=cart.find(x=>x.productId===id);if(x)x.qty++;else cart.push({productId:id,name:p.productName,price:p.salePrice,qty:1});renderCart()}
function renderCart(){let t=cart.reduce((a,x)=>a+x.qty*x.price,0);$('cart').innerHTML=cart.map((x,i)=>'<div class="cart-row"><span>'+x.name+' × '+x.qty+'</span><span>'+x.qty*x.price+' <button onclick="cart.splice('+i+',1);renderCart()">×</button></span></div>').join('');$('total').textContent=t.toFixed(2)}
async function loadWarehouses(){warehouses=await api('/api/organization/warehouses');$('warehouse').innerHTML=warehouses.map(w=>'<option value="'+w.id+'">'+w.warehouseName+'</option>').join('')}
async function loadStock(){if(!warehouses.length)await loadWarehouses();let d=await api('/api/inventory/stock?warehouseId='+$('warehouse').value);$('stockTable').innerHTML='<table><tr><th>Code</th><th>Product</th><th>Qty</th><th>Avg Cost</th></tr>'+d.map(x=>'<tr><td>'+x.code+'</td><td>'+x.product+'</td><td>'+x.quantity+'</td><td>'+x.averageCost+'</td></tr>').join('')+'</table>'}
async function createProduct(){try{await api('/api/products',{method:'POST',body:JSON.stringify({productCode:$('pc').value,productName:$('pn').value,barcode:$('pb').value||null,description:null,categoryId:null,brandId:null,unitId:null,costPrice:+$('cost').value||0,salePrice:+$('price').value||0,mrp:+$('mrp').value||0,taxPercent:0,minStockLevel:0,trackBatch:false,trackExpiry:false,allowNegativeStock:false})});$('productMsg').textContent='Product created';loadProducts()}catch(e){$('productMsg').textContent=e.message}}
async function completeSale(){try{if(!cart.length)return;let wh=warehouses[0]?.id||$('warehouse').value;let paid=+$('paid').value||0;await api('/api/sales',{method:'POST',body:JSON.stringify({branchId:warehouses[0].branchId,warehouseId:wh,customerId:null,posDeviceId:null,invoiceNo:null,paidAmount:paid,items:cart.map(x=>({productId:x.productId,variantId:null,quantity:x.qty,unitPrice:x.price,unitCost:0,discount:0,tax:0})),payments:paid?[{method:'Cash',amount:paid,referenceNo:null}]:[]})});$('saleMsg').textContent='Sale completed';cart=[];renderCart();loadProducts()}catch(e){$('saleMsg').textContent=e.message}}
async function addCategory(){await api('/api/master/categories',{method:'POST',body:JSON.stringify({code:$('cc').value,name:$('cn').value})});alert('Added')}
async function addBrand(){await api('/api/master/brands',{method:'POST',body:JSON.stringify({code:$('bc').value,name:$('bn').value})});alert('Added')}
async function addUnit(){await api('/api/master/units',{method:'POST',body:JSON.stringify({code:$('uc').value,name:$('un').value,conversionFactor:1})});alert('Added')}
async function addCustomer(){await api('/api/master/customers',{method:'POST',body:JSON.stringify({code:$('custc').value,name:$('custn').value,phone:$('custp').value})});alert('Added')}
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
if(token)start().catch(()=>logout());
</script></body></html>
